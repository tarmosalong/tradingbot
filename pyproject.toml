[project]
name = "tradingbot"
version = "0.1.0"
description = "AI-powered crypto trading bot with Binance, Claude Opus 4.6, and paper trading"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/ai/prompts.py" = ["E501"]

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*"]
